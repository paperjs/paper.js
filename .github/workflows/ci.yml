name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Liberation Sans has the metrics of Arial, which the text bounds tests
      # expect:
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm jshint
      # The tests follow the style of dito.js, which the sources follow later:
      - name: Lint the tests
        run: pnpm eslint
      # Test the built library, as that's what gets published:
      - name: Build
        run: pnpm minify
      - name: Test
        run: pnpm test:node
      - name: Test the hosted build
        run: PAPER_BUILD=hosted pnpm test:node
      # Moves the second operand of every boolean operation in the tests and
      # issue cases by tiny amounts, and fails if results got less stable or
      # less correct than in test/booleans/baseline.json:
      - name: Sweep the boolean operations
        run: pnpm exec gulp test:booleans

  # The browser suite covers what the Node tests can't, such as real layout,
  # canvas rendering and the DOM's computed styles:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Liberation Sans has the metrics of Arial, which the text tests expect:
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Runs the library built from the sources, see test/vite-plugin-paper.mjs:
      - name: Test in Chromium
        run: pnpm test:browser

  # Generate paper.d.ts from the docs and compile the TypeScript definition
  # test against it, so changes to the docs can't break the typings unnoticed:
  typings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The JsDoc Toolkit that generates the typings runs on Java:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test the typings
        run: pnpm exec gulp docs:typescript

  # Publish the latest develop build to the prebuilt/dist and prebuilt/module
  # branches, as Travis CI used to:
  prebuilt:
    needs: [test, browser, typings]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    # Pushes in quick succession, such as gulp publish's two, would otherwise
    # push to the prebuilt branches at the same time:
    concurrency:
      group: prebuilt
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The JsDoc Toolkit that generates the docs runs on Java:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build library, docs and zip
        run: pnpm zip
      - name: Deploy
        run: .github/deploy-prebuilt.sh
