name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Liberation Sans has the metrics of Arial, which the text bounds tests
      # expect:
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm jshint
      # Test the built library, as that's what gets published:
      - name: Build
        run: pnpm minify
      - name: Test
        run: pnpm test:node
      - name: Test the sourced build
        run: pnpm test:node --build=sourced

  # The browser suite covers what the Node tests can't, such as real layout,
  # canvas rendering and the DOM's computed styles:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Liberation Sans has the metrics of Arial, which the text tests expect:
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Runs the sources directly, through load.js:
      - name: Test in Chrome
        run: pnpm test:chrome

  # Publish the latest develop build to the prebuilt/dist and prebuilt/module
  # branches, as Travis CI used to:
  prebuilt:
    needs: [test, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The JsDoc Toolkit that generates the docs runs on Java:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build library, docs and zip
        run: pnpm zip
      - name: Deploy
        run: .github/deploy-prebuilt.sh
