<!DOCTYPE html>
<html>
<head>
    <title>Paper.js Tests</title>
    <link rel="stylesheet" href="../node_modules/qunitjs/qunit/qunit.css">
    <script src="../node_modules/qunitjs/qunit/qunit.js"></script>
    <!-- A current Acorn, for the tests of what hosts can parse with their own,
        see the PaperScript tests. Loaded first and renamed, as load.js
        provides the bundled one as window.acorn: -->
    <script src="../node_modules/acorn-latest/dist/acorn.js"></script>
    <script>
        window.acornLatest = window.acorn;
        delete window.acorn;
    </script>
    <script src="../dist/paper-full.js"></script>
    <script src="../node_modules/prepro/lib/browser.js"></script>
    <script src="load.js"></script>
</head>
<body>
    <h1 id="qunit-header">QUnit Test Suite</h1>
    <h2 id="qunit-banner"></h2>
    <div id="qunit-testrunner-toolbar"></div>
    <h2 id="qunit-userAgent"></h2>
    <ol id="qunit-tests"></ol>
    <div id="qunit-fixture">test markup</div>
</body>
</html>
