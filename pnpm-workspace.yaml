# pnpm only installs versions that are at least a day old, as a guard against
# compromised releases. Exempt Jürg's own packages:
minimumReleaseAgeExclude:
  - prettier-plugin-penere

overrides:
  resemblejs>canvas: ^3.2.3

# Only let the dependencies run install scripts that need them: canvas for the
# Node.js tests:
allowBuilds:
  canvas: true
